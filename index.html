<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MS Tayyorlov</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="regions.js"></script>
<style>
:root{
  --bg:#0b1020; --card:#131a30; --line:#243050; --text:#eef1ff; --muted:#8d97b8;
  --violet:#7c5cff; --mint:#2ee6a6; --danger:#ff6b81;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#2a1f6b55,transparent),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;margin:8px 0 22px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--violet),var(--mint));color:#0b1020;font-size:18px}
.brand h1{margin:0;font-size:22px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h2{margin:0 0 4px;font-size:18px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:#0e1428;color:var(--text);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--violet)}
select:disabled{opacity:.5}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;font-size:16px;
  font-weight:700;color:#0b1020;background:linear-gradient(135deg,var(--violet),var(--mint));cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:16px}
.hidden{display:none}
.hello{font-size:20px;font-weight:700;margin:0 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">MS</div>
    <div><h1>MS Tayyorlov</h1><p>Milliy sertifikat testlariga tayyorgarlik</p></div>
  </div>

  <div id="loading" class="card"><p class="sub" style="margin:0">Yuklanmoqda...</p></div>

  <form id="reg" class="card hidden">
    <h2>Ro'yxatdan o'tish</h2>
    <p class="sub">Ma'lumotlaringizni kiriting</p>
    <label>Ism *</label><input id="first" autocomplete="given-name">
    <label>Familiya *</label><input id="last" autocomplete="family-name">
    <label>Sharifi</label><input id="middle">
    <label>Telefon raqam</label><input id="phone" type="tel" placeholder="+998 90 123 45 67">
    <label>Viloyat *</label><select id="region"><option value="">Viloyatni tanlang</option></select>
    <label>Tuman *</label><select id="district" disabled><option value="">Avval viloyatni tanlang</option></select>
    <div class="err" id="err"></div>
    <button id="btn" type="submit">Ro'yxatdan o'tish</button>
  </form>

  <div id="home" class="card hidden">
    <p class="hello" id="hello"></p>
    <p class="sub" style="margin:0">Siz muvaffaqiyatli ro'yxatdan o'tdingiz. Testlar bo'limi keyingi bosqichda qo'shiladi.</p>
  </div>
</div>

<script>
const API = "https://ms-bot-server.onrender.com"; // Render havolangiz bilan almashtiring
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const $ = id => document.getElementById(id);

async function call(path, body){
  const r = await fetch(API + path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({initData: tg.initData, ...body})
  });
  if(!r.ok) throw new Error("server " + r.status);
  return r.json();
}

function fillRegions(){
  Object.keys(REGIONS).forEach(n => {
    const o = document.createElement("option"); o.value = o.textContent = n;
    $("region").appendChild(o);
  });
}
$("region").addEventListener("change", e => {
  const d = $("district");
  d.innerHTML = '<option value="">Tumanni tanlang</option>';
  const list = REGIONS[e.target.value] || [];
  list.forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; d.appendChild(o); });
  d.disabled = !list.length;
});

function show(id){
  ["loading","reg","home"].forEach(x => $(x).classList.toggle("hidden", x !== id));
}

$("reg").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  const first = $("first").value.trim(), last = $("last").value.trim();
  if(!first || !last || !$("region").value || !$("district").value){
    $("err").textContent = "Yulduzcha (*) bilan belgilangan maydonlarni to'ldiring"; return;
  }
  $("btn").disabled = true;
  try{
    await call("/api/register", {
      first_name: first, last_name: last,
      middle_name: $("middle").value.trim() || null,
      phone: $("phone").value.trim() || null,
      region: $("region").value, district: $("district").value
    });
    $("hello").textContent = "Xush kelibsiz, " + first + "!";
    show("home");
  }catch(err){
    $("err").textContent = "Xatolik. Qayta urinib ko'ring (server uyg'onayotgan bo'lishi mumkin).";
  }
  $("btn").disabled = false;
});

(async () => {
  fillRegions();
  try{
    const res = await call("/api/me", {});
    if(res.user){ $("hello").textContent = "Xush kelibsiz, " + res.user.first_name + "!"; show("home"); }
    else show("reg");
  }catch(e){ show("reg"); }
})();
</script>
</body>
</html>
